<!DOCTYPE html>
<html>
<head>
    <title>Price Prediction</title>
</head>
<body>
    <h2>Enter Car Details</h2>

    <form action="/predict" method="POST">

        {% for col in features %}
            <label>{{ col }}</label><br>
            <input type="text" name="{{ col }}" required><br><br>
        {% endfor %}

        <button type="submit">Predict Price</button>
    </form>

</body>
</html>
